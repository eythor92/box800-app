<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BOX800" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>BOX800</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Vörn: ef gömul útgáfa í geymslu vafrans kemur í veg fyrir að appið hlaðist,
      // hreinsum við geymsluna og endurhlöðum einu sinni.
      (function () {
        function fix() {
          try { if (sessionStorage.getItem('box800-fixed')) return; sessionStorage.setItem('box800-fixed', '1') } catch (e) {}
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload() });
        }
        window.addEventListener('error', function (e) { if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) fix() }, true);
        window.addEventListener('unhandledrejection', function (e) { if (String(e.reason && e.reason.message).match(/dynamically imported module|Failed to fetch|Importing a module/)) fix() });
        setTimeout(function () { var r = document.getElementById('root'); if (r && !r.children.length) fix() }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
